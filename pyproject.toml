[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-ocr"
version = "1.0.0"
description = "飞书文档OCR处理工具 - 将飞书文档照片转制为Markdown文件"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["ocr", "feishu", "lark", "document-conversion", "markdown"]
dependencies = [
    "rapidocr-onnxruntime>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/ikownive/Feishu_doc_photo_OCR_md"
Repository = "https://github.com/ikownive/Feishu_doc_photo_OCR_md"

[project.scripts]
feishu-ocr = "feishu_ocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["feishu_ocr"]
